name: Sungan
options:
  bundleIdPrefix: com.corey0o0
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  Sungan:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sungan
        excludes:
          - "App/Info.plist"
          - "App/Sungan.entitlements"
      - path: Shared
    settings:
      base:
        # info:/entitlements: 키는 파일을 '생성'해 덮어쓰므로 쓰지 않는다.
        # 직접 관리하는 파일을 빌드 세팅으로 참조만 한다.
        INFOPLIST_FILE: Sungan/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sungan/App/Sungan.entitlements
        # PRODUCT_NAME은 Swift 모듈명·실행 파일명의 기준이 되므로 ASCII로 둔다.
        # 홈 화면에 보이는 한글 이름은 Info.plist의 CFBundleDisplayName이 담당한다.
        PRODUCT_NAME: Sungan
        PRODUCT_BUNDLE_IDENTIFIER: com.corey0o0.sungan
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: SunganWidgetExtension
        embed: true
  SunganWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: SunganWidget
        excludes:
          - "Info.plist"
          - "SunganWidget.entitlements"
      - path: Shared
    settings:
      base:
        INFOPLIST_FILE: SunganWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: SunganWidget/SunganWidget.entitlements
        PRODUCT_NAME: SunganWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.corey0o0.sungan.widget
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
  SunganTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: SunganTests
    dependencies:
      - target: Sungan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.corey0o0.sungan.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Sungan.app/Sungan"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Sungan:
    build:
      targets:
        Sungan: all
        SunganTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SunganTests
    archive:
      config: Release
