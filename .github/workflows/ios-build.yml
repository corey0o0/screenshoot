name: iOS Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify Info.plist / entitlements survived generation
        run: |
          # XcodeGen의 info:/entitlements: 키는 파일을 덮어쓴다. 실수로 되돌아가면
          # 위젯이 설치 단계에서 "extensionDictionary must be set"으로 죽고,
          # 앱은 사진 권한 설명이 사라져 런타임에 크래시한다. 여기서 먼저 잡는다.
          set -e
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" \
            SunganWidget/Info.plist
          /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryUsageDescription" \
            Sungan/App/Info.plist > /dev/null
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes:0:CFBundleURLSchemes:0" \
            Sungan/App/Info.plist
          for f in Sungan/App/Sungan.entitlements SunganWidget/SunganWidget.entitlements; do
            /usr/libexec/PlistBuddy -c \
              "Print :com.apple.security.application-groups:0" "$f"
          done

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          # 러너 이미지마다 설치된 시뮬레이터가 달라 이름을 하드코딩하지 않고 조회한다.
          UDID=$(xcrun simctl list devices available \
            | grep -E '^\s+iPhone' \
            | head -1 \
            | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')
          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator found"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          xcodebuild test \
            -project Sungan.xcodeproj \
            -scheme Sungan \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO
